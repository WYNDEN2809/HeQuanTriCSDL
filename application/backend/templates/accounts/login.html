{% extends "base.html" %}
{% block title %}Đăng nhập - ScentStation{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-1"><i class="bi bi-droplet-half"></i> ScentStation</h4>
        <p class="text-muted">Đăng nhập hệ thống quản lý</p>

        {% if form.errors %}
        <div class="alert alert-danger py-2">Sai tên đăng nhập hoặc mật khẩu, hoặc tài khoản đã bị khóa.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="id_username">Tên đăng nhập</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Mật khẩu</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-dark w-100">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
