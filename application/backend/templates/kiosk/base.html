<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ScentStation Kiosk{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:#17120f; color:#f4ece1; min-height:100vh; user-select:none; }
    .brandbar { border-bottom:1px solid #3a2f27; }
    .gold { color:#d9b26f; }
    .slot-card { background:#241c17; border:1px solid #3a2f27; border-radius:1.25rem; }
    .slot-card.disabled { opacity:.45; }
    .btn-gold { background:#d9b26f; color:#1b1410; font-weight:600; border:0; padding:.9rem 1.2rem; border-radius:.9rem; }
    .btn-gold:disabled { background:#5b4d3d; color:#9c8f80; }
    .price { font-size:1.6rem; font-weight:700; }
    .qr-box { background:#fff; padding:14px; border-radius:1rem; display:inline-block; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="brandbar py-3 px-4 d-flex justify-content-between align-items-center">
    <div class="fs-4"><i class="bi bi-droplet-half gold"></i> <span class="gold">Scent</span>Station</div>
    <div class="text-secondary">{% block topright %}{% endblock %}</div>
  </div>
  <div class="container py-4">
    {% if messages %}{% for m in messages %}
      <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} fs-5">{{ m }}</div>
    {% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
